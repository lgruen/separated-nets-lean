    id: "doi:10.5281/zenodo.23327749"
    location: "https://doi.org/10.5281/zenodo.23327749 (paper/core.tex of release v1.0.0 of https://github.com/lgruen/separated-nets-lean; all versions: https://doi.org/10.5281/zenodo.23327748)"
    relationship: formalizes
    note: >-
      Results cited by their LaTeX labels. This entry formalizes thm:A of version 1 (Theorem A
      "Every dimension", section sec:dims, proved in sec:Ustar), parts (1) and (2) and the closing
      sentence on a*_s, with the net of def:Ns and the design U*_s of def:Ustar (through
